<body>
<a class="skip-link" href="#app">본문으로 이동</a>
<header>
  <button class="logo" data-page="home"><span class="brand-mark">P↗</span>PassFinder<span style="color:var(--blue)">.</span></button>
  <div class="space-label">MY STUDY SPACE</div>
  <div class="workspace-card">◈ 내 시험 준비<small>교안부터 복습까지, 한 공간에서</small></div>
  <nav aria-label="학습 메뉴">
    <button data-page="home">▦ &nbsp; 내 과목</button>
    <button data-page="review">↻ &nbsp; 복습</button>
    <button data-page="ranking">↗ &nbsp; 랭킹</button>
    <button data-page="payment">◇ &nbsp; 이용권</button>
    <button onclick="go('login')" class="logout">로그아웃</button>
  </nav>
  <div class="sidebar-note"><b style="color:var(--blue)">✦</b><b>작게 풀고, 확실하게 알기</b><p>교안을 정리하고 한 단계씩 학습하며<br>나의 이해도를 확인하세요.</p></div>
  <div class="profile"><div class="avatar">체</div><div>체험 워크스페이스<small>학습맵 · 샘플 데이터</small></div></div>
</header>
<div class="workspace">
  <div class="topbar"><div><span>워크스페이스 /</span><b id="page-crumb">내 과목</b></div><span class="demo-pill">● 프론트엔드 미리보기</span></div>
  <div class="demo-banner">ⓘ 학습맵은 샘플 데이터입니다. 과목 카드를 열어 교안을 연결하고 학습을 시작하세요.</div>
  <main id="app" tabindex="-1"></main>
  <footer class="demo">PassFinder · 교안에서 시작하는 나만의 시험 준비</footer>
</div>

<div class="overlay" id="overlay">
  <section class="modal" role="dialog" aria-modal="true"
    aria-labelledby="modalTitle" id="modal"></section>
</div>

<div class="toast" role="status" id="toast"></div>

<script>
const $ = s => document.querySelector(s);

let page = 'login';
let course = '운영체제';
const COURSE_KEY = 'pf.courses.v1';
const initialCourses = [{id:'os',name:'운영체제 중간고사',demo:true},{id:'ds',name:'자료구조',demo:true},{id:'net',name:'컴퓨터네트워크',demo:false}];
let courses;
try { const saved = JSON.parse(localStorage.getItem(COURSE_KEY)); courses = Array.isArray(saved) && saved.every(c => c && typeof c.id === 'string' && typeof c.name === 'string') ? saved : initialCourses; } catch { courses = initialCourses; }
let activeCourseId = courses[0]?.id || '';
const courseFiles = new Map();
let rankingState = {status:'idle',rows:[]};
let rankingController;
function persistCourses() { try { localStorage.setItem(COURSE_KEY, JSON.stringify(courses)); return true; } catch { toast('브라우저 저장이 제한되어 새로고침하면 과목이 사라질 수 있어요.'); return false; } }

let selected = -1;
let submitted = false;
let qIndex = 0;
let score = 0;
let totalXP = 420;
let paid = false;
let plan = 'course';
let lastFocus = null;

const stageNames = [
  '프로세스 개념',
  '프로세스 상태',
  '문맥 교환',
  '스케줄링',
  '동기화'
];

let currentStage = 2;
let cleared = false;

let files = [
  { name: '운영체제_1장.pdf', status: '분석 준비 완료' }
];

const questions = [
  {

const title = () => `
  <div class="page-title">
    <button class="back" data-page="home"
      aria-label="내 과목으로">←</button>

function escapeHTML(s) {
  return s.replace(/[&<>"']/g, c => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[c]));
}

          <b>2,900원 / 과목</b>
        </button>

        <button class="plan ${plan === 'subscription' ? 'selected' : ''}"
          onclick="selectPlan('subscription')">
          ${plan === 'subscription' ? '◉' : '○'} 시험 기간 구독
          <p class="muted">
            30일 이용 · 구독 가격은 아직 미정이에요.
          </p>
          <b>가격 확인 필요</b>
        </button>
      </div>

      <button class="primary wide" style="margin-top:24px"
        onclick="pay()"
        ${paid || plan === 'subscription' ? 'disabled' : ''}>
        ${paid ? '이미 이용권이 있어요' : '테스트 결제'}
      </button>

      <p class="demo">실제 결제가 아닌 데모 화면입니다.</p>
    </section>
  `;
}

function selectPlan(p) {
  plan = p;
  render();
}

function pay() {
  paid = true;
  render();
  toast('테스트 결제 완료! 데모 이용권이 활성화됐어요.');
}

function previewLogin(event) {
  event.preventDefault();
  if (!$('#login-form').reportValidity()) return;
  $('#login-password').value = '';
  $('#login-id').value = '';
  go('home');
  toast('체험 화면입니다. 실제 계정 인증은 아직 연결 전이에요.');
}

function togglePassword(button) {
  const input = $('#login-password');
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  button.textContent = show ? '숨기기' : '보기';
  button.setAttribute('aria-pressed', String(show));
  button.setAttribute('aria-label', show ? '비밀번호 숨기기' : '비밀번호 표시');
}

function toggleFavorite(i) {
  if (!courses[i]) return;
  courses[i].favorite = !courses[i].favorite;
  persistCourses();
  render();
  document.querySelectorAll('.favorite')[i]?.focus();
}

function openCourse(i) {
  const item = courses[i];
  if (!item) return;
  activeCourseId = item.id;
  course = item.name;
  files = courseFiles.get(item.id) || [];
  go('course');
}

async function mountGenerator() {
  const target = $('#course-generator');
  const id = activeCourseId;
  try {
    const module = await import('/study/make.mjs?course=' + encodeURIComponent(id));
    if (page === 'materials' && activeCourseId === id && target?.isConnected) module.mount(target);
  } catch {
    if (target?.isConnected) target.innerHTML = '<p>교안 연결 화면을 불러오지 못했어요.</p><button onclick="mountGenerator()">다시 시도</button>';
  }
}

async function loadRanking() {
  rankingController?.abort();
  const controller = new AbortController(); rankingController = controller;
  rankingState = {status:'loading',rows:[]}; if (page === 'ranking') render();
  const timeout = setTimeout(() => controller.abort(), 10000);
  try {
    const response = await fetch('/api/leaderboard?limit=100', {signal:controller.signal});
    const data = await response.json();
    if (!response.ok || !data.ok || !Array.isArray(data.leaderboard)) throw Error('ranking');
    const best = new Map();
    for (const row of data.leaderboard) {
      if (typeof row.player_name !== 'string' || !Number.isFinite(Number(row.score))) continue;
      const previous = best.get(row.player_name);
      if (!previous || Number(row.score) > Number(previous.score)) best.set(row.player_name,row);
    }
    if (rankingController !== controller) return;
    rankingState = {status:'ready',rows:[...best.values()].sort((a,b)=>Number(b.score)-Number(a.score))};
  } catch { if (rankingController !== controller) return; rankingState = {status:'error',rows:[]}; }
  finally { clearTimeout(timeout); }
  if (page === 'ranking') render();
}

function stageClick(i) {
  if (i > currentStage) {
    return toast('앞 스테이지를 먼저 깨 주세요.');
  }
  startQuiz();
}

function startQuiz() {
  qIndex = 0;
  score = 0;
  selected = -1;
  submitted = false;
  go('quiz');
}

function choose(i) {
  if (submitted) return;
  selected = i;
  render();
}

function submitAnswer() {
  if (selected < 0 || submitted) return;
  submitted = true;

  if (selected === questions[qIndex].correct) {
    score++;
  }

  render();
}

function nextQuestion() {
  if (qIndex < 4) {
    qIndex++;
    selected = -1;
    submitted = false;
    render();
  } else {
    if (score >= 4) {
      cleared = true;
      currentStage = Math.min(currentStage + 1, 4);
    }

    totalXP += score * 10
      + (score >= 4 ? 20 : 0)
      + (score === 5 ? 10 : 0);

    go('result');
  }
}

function addFiles(list) {
  for (const f of list) {
    if (!f.name.toLowerCase().endsWith('.pdf')) {
      toast('PDF 파일만 올릴 수 있어요.');
      continue;
    }

    if (!f.size || f.size > 50 * 1024 * 1024) {
      toast('0바이트 또는 50MB 초과 파일은 올릴 수 없어요.');
      continue;
    }

    if (files.length >= 20) {
      toast('교안은 최대 20개까지 표시할 수 있어요.');
      break;
    }

    if (files.some(x => x.name === f.name)) {
      toast('이미 추가한 교안입니다.');
      continue;
    }

    files.push({
      name: f.name,
      status: '데모 · 분석 미연결'
    });
  }

  render();
}

function toast(t) {
  $('#toast').textContent = t;
  $('#toast').style.display = 'block';

  clearTimeout(window.toastTimer);

  window.toastTimer = setTimeout(() => {
    $('#toast').style.display = 'none';
  }, 3300);
}

async function copyText(t) {
  try {
    await navigator.clipboard.writeText(t);
    toast('복사했어요.');
  } catch {
    const a = document.createElement('textarea');
    a.value = t;
    document.body.append(a);
    a.select();

    const ok = document.execCommand('copy');
    a.remove();

    toast(ok
      ? '복사했어요.'
      : '복사가 제한돼 있어요. 문구를 직접 선택해 주세요.');
  }
}

function showModal(html) {
  lastFocus = document.activeElement;
  $('#modal').innerHTML = html;
  $('#overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  $('#modal').querySelector('button')?.focus();
}

function closeModal() {
  $('#overlay').classList.remove('open');
  document.body.style.overflow = '';
  lastFocus?.focus();
}

function manual() {
  showModal(`
    <div class="row between">
      <h2 id="modalTitle">Claude 연결 안내</h2>
      <button class="back" onclick="closeModal()"
        aria-label="닫기">×</button>
    </div>

    <p class="muted">아래 순서대로 연결해 주세요.</p>

    <div class="step">
      <div class="row">
        <span class="number">1</span>
        <h3 style="margin:0">MCP 주소 복사</h3>
      </div>

      <p class="muted">
        실제 배포 시 서비스의 MCP 주소가 표시됩니다.
      </p>

      <div class="copybox">
        <span>MCP 서버 주소 · 아직 설정되지 않음</span>
        <button class="outline small"
          onclick="toast('실제 MCP 서버 주소를 연결한 뒤 복사할 수 있어요.')">
          복사
        </button>
      </div>
    </div>

    <div class="step">
      <div class="row">
        <span class="number">2</span>
        <h3 style="margin:0">Claude에서 연결</h3>
      </div>

      <p class="muted">
        Claude의 연결 설정에 서비스의 MCP 주소를 등록하세요.
      </p>

      <details>
        <summary>설정 위치 확인</summary>
        <p>
          Claude의 MCP 연결 설정에서 서비스를 등록해 주세요.
          앱 버전에 따라 설정 위치와 원격 연결 지원 여부가 달라질 수 있어요.
          실제 연결 안내는 배포 환경에 맞춰 제공됩니다.
        </p>
      </details>
    </div>

    <div class="step">
      <div class="row">
        <span class="number">3</span>
        <h3 style="margin:0">학습 준비 요청</h3>
      </div>

      <p class="muted">
        연결이 완료되면 아래 문구를 Claude에 보내세요.
      </p>

      <div class="copybox">
        <span>
          ${escapeHTML(course)} 교안을 읽고 개념과 문제를 만들어 줘.
        </span>
        <button class="outline small" onclick="copyPrompt()">
          문구 복사
        </button>
      </div>
    </div>

    <div class="notice row between">
      <span>
        아직 연결이 확인되지 않았어요.<br>
        <span class="muted">현재는 UI 데모예요.</span>
      </span>
      <button class="primary small"
        onclick="toast('MCP 서버 미연결: 실제 연결 상태는 확인할 수 없어요.')">
        연결 상태 확인
      </button>
    </div>
  `);
}

function copyPrompt() {
  copyText(course + ' 교안을 읽고 개념과 문제를 만들어 줘.');
}

function newCourse() {
  showModal(`
    <div class="row between">
      <h2 id="modalTitle">새 과목 만들기</h2>
      <button class="back" onclick="closeModal()">×</button>
    </div>

    <label>
      과목 이름
      <input id="courseName" type="text" maxlength="50"
        placeholder="예: 운영체제 중간고사">
    </label>

    <button class="primary wide" onclick="createCourse()">
      만들기
    </button>
  `);
}

function createCourse() {
  const name = $('#courseName').value.trim();

  if (!name) {
    return toast('과목 이름을 입력해 주세요.');
  }

  const item = {id:crypto.randomUUID(), name, demo:false};
  courses.push(item);
  persistCourses();
  closeModal();
  go('home');
  toast('새 과목이 만들어졌어요. 과목 카드를 열어 교안을 연결하세요.');
}

function report() {
  showModal(`
    <div class="row between">
      <h2 id="modalTitle">문제 신고</h2>
      <button class="back" onclick="closeModal()">×</button>
    </div>

    <p class="muted">
      신고 사유를 선택하세요. 데모에서는 서버로 전송되지 않아요.
    </p>

    ${['정답 오류', '모호한 문항', '시험 범위 밖'].map(s => `
      <button class="wide" style="margin-top:12px"
        onclick="closeModal();toast('신고 선택을 확인했어요. 실제 전송은 연결되지 않았어요.')">
        ${s}
      </button>
    `).join('')}
  `);
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-page]');
  if (b) go(b.dataset.page);
});

$('#overlay').addEventListener('click', e => {
  if (e.target === $('#overlay')) closeModal();
});

document.addEventListener('keydown', e => {
  if (!$('#overlay').classList.contains('open')) return;

  if (e.key === 'Escape') closeModal();

  if (e.key === 'Tab') {
    const f = [
      ...$('#modal').querySelectorAll('button,input,summary,a')
    ].filter(x => !x.disabled);

    if (!f.length) return;

    const first = f[0];
    const last = f[f.length - 1];

    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
  }
});

const stageObserver = new IntersectionObserver(entries => {
  entries.forEach(entry => entry.target.classList.toggle('in-view', entry.isIntersecting));
}, {rootMargin:'-20% 0px -30% 0px', threshold:0.5});

render();
</script>
