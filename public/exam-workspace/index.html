<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>PassFinder · 나만의 시험 준비</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <a class="skip-link" href="#main">본문으로 이동</a>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#bank" aria-label="PassFinder 문제은행"><span class="brand-mark">P<span>↗</span></span>PassFinder<span class="brand-dot"></span></a>
      <div class="space-label">MY STUDY SPACE</div>
      <div class="course"><span class="course-icon">◈</span><span><strong>자료구조</strong><small>체험 과목 · 샘플 데이터</small></span></div>
      <nav aria-label="학습 메뉴">
        <a href="#bank" data-nav="bank"><span aria-hidden="true">▦</span>문제은행 <span class="nav-count">8</span></a>
        <a href="#papers" data-nav="papers"><span aria-hidden="true">▤</span>시험지</a>
        <a href="#results" data-nav="results"><span aria-hidden="true">▥</span>점수</a>
        <a href="#ranking" data-nav="ranking"><span aria-hidden="true">↗</span>예상 등수</a>
      </nav>
      <div class="sidebar-note"><span class="sparkle">✦</span><strong>작게 풀고, 확실하게 알기</strong><p>문제를 고르고 직접 풀어보며<br>나의 이해도를 확인하세요.</p></div>
      <a class="legacy-link" href="/">기존 교안 업로드 <span aria-hidden="true">↗</span></a>
      <div class="profile"><span class="avatar">체</span><span>체험 워크스페이스<small>로그인 · DB 연결 전</small></span></div>
    </aside>
    <div class="workspace">
      <header class="topbar"><div><span class="breadcrumb">워크스페이스</span><span class="crumb-separator">/</span><span id="page-crumb">문제은행</span></div><span class="demo-pill"><span></span>프론트엔드 미리보기</span></header>
      <div class="demo-banner"><span aria-hidden="true">ⓘ</span><p><strong>샘플 데이터로 체험 중이에요.</strong> 생성한 시험지와 점수는 서버에 저장되지 않으며, 새로고침하면 초기화됩니다.</p></div>
      <main id="main" tabindex="-1"></main>
      <footer>PassFinder <span>문제은행 → 시험지 → 점수 → 예상 등수</span></footer>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p>이 미리보기는 JavaScript가 필요합니다. 서버 저장과 실제 등수 추정은 연결 전입니다.</p></noscript>
</body>
</html>
