<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>PassFinder · 교안으로 문제 만들기</title>
  <link rel="stylesheet" href="./styles.css">
  <style>
    .make { max-width: 720px; margin: 0 auto; padding: 20px 16px 48px; }
    .make h1 { font-size: 1.4rem; margin: 8px 0 4px; }
    .make .lead { color: #555; margin: 0 0 16px; }
    .card { background: #fff; border-radius: 14px; padding: 16px; margin: 12px 0; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .make button, .make .btn { padding: 10px 16px; border: 0; border-radius: 10px; background: #4f46e5; color: #fff; font-size: 1rem; cursor: pointer; }
    .make button.ghost { background: #eef; color: #3730a3; }
    .make button:disabled { background: #c7c7d1; cursor: not-allowed; }
    .make input[type=number] { width: 5.5em; padding: 8px; border: 1px solid #ccd; border-radius: 8px; }
    .badge { display: inline-block; font-size: .8rem; padding: 2px 8px; border-radius: 999px; background: #e0f2fe; color: #075985; }
    .badge.sample { background: #fef3c7; color: #92400e; }
    .msg { padding: 10px 12px; border-radius: 10px; background: #e0f2fe; color: #075985; margin: 8px 0; }
    .msg.error { background: #fee2e2; color: #991b1b; }
    .q { border-top: 1px solid #eee; padding: 12px 0; }
    .q:first-child { border-top: 0; }
    .q legend { font-weight: 600; margin-bottom: 8px; }
    .q label { display: block; padding: 8px 10px; border: 1px solid #e5e5ee; border-radius: 10px; margin: 6px 0; cursor: pointer; }
    .q label.right { border-color: #16a34a; background: #f0fdf4; }
    .q label.wrong { border-color: #dc2626; background: #fef2f2; }
    .evidence { font-size: .9rem; color: #444; background: #f7f7fb; border-left: 3px solid #a5b4fc; padding: 8px 10px; margin-top: 8px; }
    .saved li { margin: 6px 0; }
    .score { font-size: 1.6rem; font-weight: 700; }
    a.back { color: #4f46e5; text-decoration: none; }
  </style>
  <script type="module" src="./make.mjs"></script>
</head>
<body>
  <div class="make">
    <a class="back" href="./">← 문제은행(샘플) 화면으로</a>
    <h1>교안으로 문제 만들기</h1>
    <p class="lead">PDF를 고르고 범위를 정하면, 학교 AI가 그 범위에서 객관식 5문제를 만들어요. AI 계정이나 설정은 필요 없어요.</p>
    <main id="app" aria-live="polite"><p>불러오는 중…</p></main>
  </div>
  <noscript><p>이 화면은 JavaScript가 필요해요.</p></noscript>
</body>
</html>
